<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금융행동 사전검증 — Action Reversal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root {
    --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fa;
    --ink:#10131a; --ink-2:#545e6e; --ink-3:#8992a1;
    --line:#e1e5ec; --line-strong:#c7ccd6;
    --accent:#1a56e8; --accent-ink:#0e3bb0; --accent-sf:#ebf0fe;
    --good:#14824b; --good-sf:#e4f4ea;
    --warn:#a15b12; --warn-sf:#f7ecdc;
    --crit:#b0272f; --crit-sf:#fbe9ea;
    --mono: "JetBrains Mono", ui-monospace, Consolas, "D2Coding", monospace;
    --shadow-sm: 0 1px 2px rgba(16,19,26,0.05);
    --shadow-md: 0 8px 24px -12px rgba(16,19,26,0.16), 0 2px 6px rgba(16,19,26,0.05);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Gothic A1","Pretendard",-apple-system,"Malgun Gothic",sans-serif;
    line-height:1.6; padding:28px 20px 80px; }
  .wrap { max-width:760px; margin:0 auto; }

  .appbar { display:flex; align-items:center; gap:10px; padding:2px 0 20px; }
  .logo { width:30px; height:30px; border-radius:8px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; flex:none; }
  .logo svg { width:16px; height:16px; }
  .appname { font-size:16px; font-weight:800; letter-spacing:-0.01em; }
  .appbar .spacer { flex:1; }

  h1 { font-size:21px; font-weight:800; margin:0 0 4px; letter-spacing:-0.01em; text-wrap:balance; }
  .lede { font-size:13px; color:var(--ink-3); margin:0 0 16px; }
  .snapshot { font-size:11.5px; font-family:var(--mono); color:var(--ink-2); background:var(--surface);
    border:1px solid var(--line); border-radius:999px; padding:6px 13px; display:inline-flex;
    align-items:center; gap:6px; margin-bottom:22px; }
  .snapshot::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--good); flex:none; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow-sm); padding:20px 22px 22px; margin-bottom:14px; }
  label { font-size:12.5px; font-weight:600; color:var(--ink-2); display:block; margin-bottom:7px; }
  textarea, input, select { width:100%; padding:10px 13px; border:1.5px solid var(--line-strong);
    border-radius:10px; font-size:13.5px; font-family:inherit; color:var(--ink);
    background:var(--surface-2); margin-bottom:13px; }
  textarea:focus, input:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px;
    border-color:var(--accent); background:var(--surface); }
  select, input:not([type=checkbox]) { background:var(--surface); }

  button { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 18px;
    font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer; }
  button:hover { background:var(--accent-ink); }
  button:focus-visible { outline:2px solid var(--accent-ink); outline-offset:2px; }
  button.secondary { background:var(--surface); color:var(--ink); border:1.5px solid var(--line-strong); }

  .badge { display:inline-block; padding:5px 14px; border-radius:100px; font-weight:700; font-size:13.5px;
    font-family:var(--mono); }
  .badge.PASS, .badge.SAFE { background:var(--good-sf); color:var(--good); }
  .badge.REVIEW, .badge.WARNING { background:var(--warn-sf); color:var(--warn); }
  .badge.HOLD, .badge.EXECUTION_BLOCKED, .badge.BREACH { background:var(--crit-sf); color:var(--crit); }
  .badge.NOT_APPLICABLE { background:var(--surface-2); color:var(--ink-3); }

  .subhead { font-size:11px; font-weight:700; color:var(--ink-3); text-transform:uppercase;
    letter-spacing:.05em; margin:20px 0 9px; }
  .subhead:first-child { margin-top:0; }
  .note { font-size:11.5px; color:var(--ink-3); margin-top:7px; line-height:1.55; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:2px; }
  .stat { background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
  .stat .l { font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; }
  .stat .v { font-family:var(--mono); font-size:15px; font-weight:700; margin-top:4px;
    font-variant-numeric:tabular-nums; }
  .reason { margin-top:12px; font-size:13.5px; color:var(--ink); line-height:1.6; }
  .evidence { margin-top:10px; font-size:11.5px; color:var(--ink-2); font-family:var(--mono);
    word-break:break-all; line-height:1.7; }
  .evidence a { color:var(--accent-ink); }
  .interpret-box { font-size:12.5px; padding:11px 13px; border-radius:10px; margin-top:11px; line-height:1.6; }
  .interpret-box.OK { background:var(--good-sf); color:var(--ink); }
  .interpret-box.NEED_INFO, .interpret-box.UNSUPPORTED { background:var(--warn-sf); color:var(--ink); }
  .interpret-box.ERROR { background:var(--crit-sf); color:var(--ink); }

  #resultCard { box-shadow:var(--shadow-md); }
  #resultCard #decisionBadge { margin-bottom:2px; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0b0d12; --surface:#15181f; --surface-2:#1b1f27;
      --ink:#e9ebf0; --ink-2:#a4abb8; --ink-3:#6c7684;
      --line:#262b35; --line-strong:#343b47;
      --accent:#6d93ff; --accent-ink:#9db4ff; --accent-sf:#16213f;
      --good:#4bc490; --good-sf:#122a20;
      --warn:#dba05a; --warn-sf:#2b2113;
      --crit:#e8747a; --crit-sf:#2e1517;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L4 8V16L12 21L20 16V8L12 3Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 3V21M4 8L12 12L20 8" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="appname">Butterfin</span>
    <span class="spacer"></span>
  </div>

  <h1>금융행동 사전검증</h1>
  <p class="lede">계획 중인 행동이 지금 받고 있는 우대조건을 깨는지, 실행 전에 확인하세요.</p>
  <div class="snapshot" id="snapshot">검증 스냅샷 기준일 확인 중…</div>

  <div class="card">
    <label>1. 하려는 행동을 문장으로 입력하세요</label>
    <textarea id="actionText" rows="2" placeholder="예: 다음 달부터 카드사용 5만원을 다른 카드로 옮길 거야"></textarea>
    <button id="interpretBtn">해석하기</button>
    <div id="interpretResult"></div>
  </div>

  <div class="card">
    <label>2. 자동으로 채워진 값 확인 후 검증 실행</label>
    <select id="actionType">
      <option value="CARD_SPEND_SHIFT">CARD_SPEND_SHIFT (카드실적 이동)</option>
      <option value="PRODUCT_TERMINATION">PRODUCT_TERMINATION (상품 해지)</option>
      <option value="PAYMENT_ACCOUNT_CHANGE">PAYMENT_ACCOUNT_CHANGE (결제계좌 변경)</option>
      <option value="SALARY_ACCOUNT_CHANGE">SALARY_ACCOUNT_CHANGE (급여계좌 변경)</option>
    </select>
    <label>은행/기관 (선택 — 은행명만으로는 상품이 안 좁혀질 수 있어 아래 상품명과
      별개로 관리됩니다. 비워두면 해당 행동 유형의 모든 등록 은행을 대상으로 판정)</label>
    <select id="institution">
      <option value="">전체 (자동)</option>
    </select>
    <label>상품명 (선택 — 같은 은행이 여러 상품을 취급하거나 같은 상품을 여러 은행이
      취급할 수 있어 은행명과 독립적으로 좁힙니다)</label>
    <select id="product">
      <option value="">전체 (자동)</option>
    </select>
    <label>월 이동 금액 (원, CARD_SPEND_SHIFT일 때만)</label>
    <input id="amount" type="number" value="30000">
    <label>이 행동으로 즉시 얻는 이득 (원/월, 선택 — 예: 옮기는 카드의 캐시백. CARD_SPEND_SHIFT일 때만, Action Reversal 판정에 씀)</label>
    <input id="directBenefit" type="number" value="0">
    <label><input id="exceptionMet" type="checkbox" style="width:auto;display:inline;margin-right:6px;">예외 조건(예: 청약 당첨 해지)이 적용됨</label>
    <button id="evaluateBtn">검증 실행</button>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div id="decisionBadge"></div>
    <div class="reason" id="reasonText"></div>
    <div id="statGrid"></div>
    <div class="evidence" id="evidenceText"></div>
  </div>
</div>

<script>
async function loadSnapshot() {
  const r = await fetch('/api/health').then(r => r.json()).catch(() => null);
  const el = document.getElementById('snapshot');
  if (r) {
    el.textContent = `검증 스냅샷 기준일: ${r.verified_at || '?'} · 규칙 ${r.rules_loaded}개 로딩 · 상태: ${r.status === 'ok' ? '정상' : '점검 필요'}`;
    // 은행/상품 드롭다운을 서버가 실제로 로딩한 institution/product 목록으로 채운다 —
    // demo_rules.json에 있는 이름만 옵션으로 나오게 해서(하드코딩 안 함) 프론트와
    // 데이터가 어긋나지 않게 한다. 둘은 독립적인 축이라 각자 따로 채운다.
    const fillOptions = (selectId, values) => {
      if (!Array.isArray(values)) return;
      const sel = document.getElementById(selectId);
      for (const v of values) {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
      }
    };
    fillOptions('institution', r.institutions);
    fillOptions('product', r.products);
  } else {
    el.textContent = '서버 상태를 확인할 수 없습니다.';
  }
}
loadSnapshot();

document.getElementById('interpretBtn').onclick = async () => {
  const text = document.getElementById('actionText').value;
  const box = document.getElementById('interpretResult');
  box.innerHTML = '해석 중…';
  try {
    const res = await fetch('/api/interpret', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})});
    const data = await res.json();
    const d = data.delta;
    // 내부 예외 메시지(d.reason)는 화면에 노출하지 않는다 — action_type이나
    // clarifying_question처럼 사람이 읽을 수 있게 준비된 문구만 보여준다.
    const shown = d.action_type || d.clarifying_question || (d.status === 'UNSUPPORTED' ? '지원하지 않는 행동 유형입니다.' : '');
    const foundBits = [d.institution, d.product].filter(Boolean).join(' · ');
    const dbBit = d.direct_benefit_monthly ? ' · 직접이득 ' + d.direct_benefit_monthly.toLocaleString() + '원 인식됨' : '';
    box.innerHTML = `<div class="interpret-box ${d.status}"><b>${d.status}</b> — ${shown}${d.amount_monthly ? ' · ' + d.amount_monthly.toLocaleString() + '원' : ''}${foundBits ? ' · [' + foundBits + '] 인식됨' : ''}${dbBit}</div>`;
    if (d.status === 'OK' || d.status === 'NEED_INFO') {
      if (d.action_type) document.getElementById('actionType').value = d.action_type;
      if (d.amount_monthly) document.getElementById('amount').value = d.amount_monthly;
      // 2026-09-04 추가: 문장에 "직접효과/즉시 이득"이 금액과 함께 명시돼 있으면 그
      // 값으로 카드 2의 직접 이득 입력창을 채운다. 문장에 없으면(null) 손대지 않는다 —
      // 기존 값(기본 0 또는 사용자가 이미 입력해둔 값)을 그대로 둔다. amount_monthly와
      // 마찬가지로 사용자가 카드 2에서 그대로 확인·수정할 수 있다.
      if (d.direct_benefit_monthly !== null && d.direct_benefit_monthly !== undefined) {
        document.getElementById('directBenefit').value = d.direct_benefit_monthly;
      }
      // 문장에 등록된 은행명/상품명이 언급됐으면(예: "신협 카드로 옮길 거야", "디딤돌대출
      // 해지하려고") 두 드롭다운을 각각 독립적으로 자동 선택한다 — 은행명만으로는
      // 상품이 안 좁혀질 수 있어서 하나가 다른 하나를 대신하지 않는다. 옵션에 없는
      // 값이면(서버가 모르는 이름) 그냥 둔다.
      const autoSelect = (selectId, value) => {
        const sel = document.getElementById(selectId);
        if (value && Array.from(sel.options).some(o => o.value === value)) {
          sel.value = value;
        }
      };
      autoSelect('institution', d.institution);
      autoSelect('product', d.product);
    }
  } catch (e) {
    box.innerHTML = `<div class="interpret-box ERROR">해석 요청 중 문제가 발생했습니다. 아래 2번 항목에서 직접 입력해 주세요.</div>`;
  }
};

// ---- 표시 헬퍼: 값이 없으면(null/undefined) 절대 "0원"으로 보이지 않게 한다.
// engine API가 계산을 안 한 것(unknown)과 0으로 계산된 것(known-zero)을 구분해서
// 넘겨주므로, 프론트는 그 판단을 다시 하지 않고 그대로 옮겨 적기만 한다.
function fmtWon(v) {
  return (v === null || v === undefined) ? '확인 필요' : (v >= 0 ? '+' : '') + Math.round(v).toLocaleString() + '원';
}
function fmtWonPlain(v) {
  return (v === null || v === undefined) ? '확인 필요' : Math.round(v).toLocaleString() + '원';
}
function fmtMonth(v) {
  return (v === null || v === undefined) ? '없음' : v + '개월 뒤';
}
function statCard(l, v) {
  return `<div class="stat"><div class="l">${l}</div><div class="v">${v}</div></div>`;
}
function fmtRange(min, max) {
  if (min === null && max === null) return '계산에 필요한 정보 부족';
  return `${fmtWonPlain(min)} ~ ${fmtWonPlain(max)}`;
}

// FIX-1(02_FIX_1차원SafeZone_4개.md): "불확실성 정보 없음 → nominal과 동일" 정책을
// 채택했다 — robust_safe_limit은 이미 nominal과 같은 값으로 계산돼 있으므로(엔진이
// 임의 버퍼를 만들지 않음), 화면 문구도 "계산 안 함"이라고 하지 않는다. 숫자 범위와
// "계산 안 함"을 동시에 보여주던 예전 모순 표현을 여기서 없앤다.
const ROBUST_STATUS_LABEL = {
  CALCULATED: '계산됨 (확인된 불확실성 범위 기준)',
  NOT_APPLICABLE: '불확실성 정보 없음 → Nominal Safe Zone과 동일 (임의 버퍼를 만들지 않음)',
  EMPTY_SAFE_ZONE: '안전구간 없음 — 최악의 경우 즉시 위반 가능',
};
// FIX-2: robust와 nominal이 같으면 Warning Zone은 공집합이다. "20,000원 ~ 20,000원"처럼
// 폭이 0인 숫자 구간으로 보여주지 않고 이 라벨로 대체한다.
const WARNING_STATUS_LABEL = {
  CALCULATED: null,  // 실제 구간이 있을 때는 라벨 대신 숫자 범위를 그대로 보여준다.
  NONE: '해당 없음 — Robust Safe Zone과 Nominal Safe Limit이 같아 경고구간이 존재하지 않습니다.',
  NOT_APPLICABLE: '계산에 필요한 정보 부족',
};
const CLIFF_STATUS_LABEL = {
  CALCULATED: '계산됨',
  NOT_APPLICABLE: '해당 없음 (실제 불연속 지점 없음)',
  UNKNOWN: '계산에 필요한 정보 부족 (연계 잔액 등 미입력)',
};

document.getElementById('evaluateBtn').onclick = async () => {
  const action_type = document.getElementById('actionType').value;
  const institution = document.getElementById('institution').value || undefined;
  const product = document.getElementById('product').value || undefined;
  const amount_monthly = Number(document.getElementById('amount').value);
  const direct_benefit_monthly = Number(document.getElementById('directBenefit').value) || 0;
  const exception_condition_met = document.getElementById('exceptionMet').checked;

  let data;
  try {
    const res = await fetch('/api/evaluate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action_type, institution, product, amount_monthly, direct_benefit_monthly, exception_condition_met})});
    if (!res.ok) throw new Error('server_error');
    data = await res.json();
  } catch (e) {
    // fail-closed: 서버/네트워크 문제로 판정을 못 받으면 자동으로 PASS인 척하지
    // 않는다 — REVIEW로 표시하고 사람 확인을 안내한다.
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('decisionBadge').innerHTML = `<span class="badge REVIEW">REVIEW</span>`;
    document.getElementById('reasonText').textContent = '서버에서 판정 결과를 받지 못했습니다. 잠시 후 다시 시도하거나 담당자에게 확인해 주세요.';
    document.getElementById('statGrid').innerHTML = '';
    document.getElementById('evidenceText').innerHTML = '';
    return;
  }

  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('decisionBadge').innerHTML = `<span class="badge ${data.decision}">${data.decision}</span>`;
  document.getElementById('reasonText').textContent = data.reason || '판정 사유를 확인할 수 없습니다.';

  // 06_MVP_표시명세.md 순서를 그대로 따른다. 프론트는 여기서 아무 것도 다시
  // 계산하지 않는다 — engine API(app.py /api/evaluate)가 이미 계산해 돌려준
  // safety/effects/time/evidence 값을 순서대로 옮겨 적을 뿐이다.
  const safety = data.safety || {};
  const effects = data.effects || {};
  const time = data.time || {};
  const isDiscreteType = safety.current_zone === 'NOT_APPLICABLE' && (data.action ? data.action.amount === null : true);

  let html = '';

  // 2. 현재 계획 행동량
  html += `<div class="subhead">2. 현재 계획 행동량</div><div class="stat-grid">`;
  html += statCard('행동 유형', (data.action && data.action.type) || '확인 필요');
  html += statCard('계획 금액', (data.action && data.action.amount !== null && data.action.amount !== undefined)
    ? data.action.amount.toLocaleString() + '원/월'
    : '해당 없음 (금액 기반 유형이 아님)');
  html += `</div>`;

  if (isDiscreteType) {
    html += `<div class="note">이 행동 유형(해지/계좌변경 등)은 1차원 연속 금액 모델을 쓰지 않아 Safe Zone/Financial Cliff 개념이 적용되지 않습니다 — 아래 3~8번은 모두 해당 없음으로 표시됩니다.</div>`;
  }

  // 3. Robust Safe Zone
  html += `<div class="subhead">3. Robust Safe Zone</div><div class="stat-grid">`;
  html += statCard('범위', fmtRange(safety.robust_safe_zone ? safety.robust_safe_zone.min : null, safety.robust_safe_zone ? safety.robust_safe_zone.max : null));
  html += statCard('상태', ROBUST_STATUS_LABEL[safety.robust_status] || safety.robust_status || '확인 필요');
  html += `</div>`;
  if (safety.robust_status === 'NOT_APPLICABLE') {
    html += `<div class="note">위 범위는 Robust 기준으로 새로 계산된 값이 아니라, Nominal Safe Zone과 동일한 값을 그대로 보여준 것입니다.</div>`;
  }

  // 4. Warning Zone — FIX-2: robust==nominal(공집합)이면 숫자 구간 대신 "해당 없음"만 보여준다.
  html += `<div class="subhead">4. Warning Zone</div><div class="stat-grid">`;
  const wz = safety.warning_zone || {};
  const warningLabel = WARNING_STATUS_LABEL[safety.warning_status];
  html += statCard('범위 (초과 ~ 이하)', warningLabel || fmtRange(wz.min_exclusive, wz.max_inclusive));
  html += `</div>`;

  // 5. Nominal Safe Limit
  html += `<div class="subhead">5. Nominal Safe Limit</div><div class="stat-grid">`;
  html += statCard('한도', safety.nominal_safe_limit !== null && safety.nominal_safe_limit !== undefined ? fmtWonPlain(safety.nominal_safe_limit) + '/월' : '확인 필요');
  html += `</div>`;

  // 6. 현재 행동 위치
  html += `<div class="subhead">6. 현재 행동 위치</div><div class="stat-grid">`;
  html += statCard('구간', `<span class="badge ${safety.current_zone}">${safety.current_zone || '확인 필요'}</span>`);
  html += `</div>`;

  // 7. Binding Constraint
  html += `<div class="subhead">7. Binding Constraint</div><div class="stat-grid">`;
  html += statCard('가장 엄격한 계약(동률 포함)', (safety.binding_constraints && safety.binding_constraints.length) ? safety.binding_constraints.join(', ') : '확인 필요');
  html += `</div>`;

  // 8. Financial Cliff — FIX-3: 항상 horizon_months(12개월) 누적 기준. 아래 9번(D/L/G)의
  // 기준 시점(TTR/TTB, 12개월보다 이를 수 있음)과 다를 수 있다는 걸 단위와 함께 명시한다.
  const cliff = safety.financial_cliff;  // {value, unit, horizon_months} | null
  html += `<div class="subhead">8. Financial Cliff</div><div class="stat-grid">`;
  html += statCard('불연속 크기 (경계 넘을 때 손익 점프)', cliff ? `${fmtWon(cliff.value)} (${cliff.horizon_months}개월 누적 기준)` : (CLIFF_STATUS_LABEL[safety.cliff_status] || '확인 필요'));
  html += statCard('상태', CLIFF_STATUS_LABEL[safety.cliff_status] || safety.cliff_status || '확인 필요');
  html += `</div>`;

  // 9. D / L / G — FIX-3: 각 값이 몇 개월 시점 누적인지(horizon_months) 함께 보여준다.
  // 이 시점은 8번 Financial Cliff의 12개월과 다를 수 있다(TTR/TTB가 12개월보다 이르면
  // 그 시점 기준) — 계산 오류가 아니라 서로 다른 걸 보여주는 두 값이라는 뜻이다.
  html += `<div class="subhead">9. 경제적 효과 (D / L / G)</div><div class="stat-grid">`;
  if (effects.D !== null && effects.D !== undefined) {
    const h = effects.D.horizon_months;
    html += statCard(`직접효과 D (${h}개월 누적)`, fmtWon(effects.D.value));
    html += statCard(`연쇄효과 L (${h}개월 누적)`, fmtWon(effects.L.value));
    html += statCard(`전체효과 G = D + L (${h}개월 누적)`, fmtWon(effects.G.value));
  } else {
    html += statCard('D / L / G', '이 유형은 금액 모델 미지원 (%p 우대만 판정)');
  }
  html += `</div>`;
  if (effects.D !== null && effects.D !== undefined && cliff && effects.D.horizon_months !== cliff.horizon_months) {
    html += `<div class="note">위 D/L/G는 ${effects.D.horizon_months}개월 시점 기준, 8번 Financial Cliff는 ${cliff.horizon_months}개월 시점 기준입니다 — 기준 시점이 달라 숫자가 차이 날 수 있습니다(계산 오류 아님).</div>`;
  }

  // 10. Action Reversal — FIX-4: 상단 판정 사유(위 reasonText, TTR 기준 "누적 전체효과
  // 음수 전환" 문구)와 이 섹션의 "Action Reversal 정의(D>0, G<0) 충족 여부"는 서로 다른
  // 질문이다. 둘을 같은 자리에 섞어 보여주면 모순처럼 읽힐 수 있어 완전히 분리한다.
  html += `<div class="subhead">10. Action Reversal (정의: 직접효과 D&gt;0 이고 전체효과 G&lt;0)</div><div class="stat-grid">`;
  html += statCard('발생 여부', effects.reversal ? '예 — 당장은 이득이나 전체 손익은 손실' : '아니오');
  html += `</div>`;
  if (effects.reversal_reason) {
    html += `<div class="reason" style="margin-top:8px;">${effects.reversal_reason}</div>`;
  }

  // 11. TTB / TTR
  html += `<div class="subhead">11. Time-to-Breach / Time-to-Reversal</div><div class="stat-grid">`;
  html += statCard('TTB (우대 조건이 깨지는 시점)', fmtMonth(time.TTB));
  html += statCard('TTR (누적 전체효과가 손해로 전환되는 시점)', fmtMonth(time.TTR));
  html += `</div>`;

  if (data.matched_rules) {
    html += `<div class="note">매칭 규칙: ${data.matched_rules.join(', ') || '없음'}</div>`;
  }

  document.getElementById('statGrid').innerHTML = html;

  // 12. 공식 Evidence — 여러 계약이 매칭될 수 있으므로 배열로 온다.
  const ev = document.getElementById('evidenceText');
  const evList = Array.isArray(data.evidence) ? data.evidence : (data.evidence ? [data.evidence] : []);
  if (evList.length) {
    ev.innerHTML = '<div class="subhead" style="margin-top:0;">12. 공식 Evidence</div>' + evList.map(e => {
      const url = e.source_url;
      const safeUrl = url && /^https?:\/\//i.test(url) ? url : null;
      const link = safeUrl
        ? `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeUrl}</a>`
        : (url || '확인 필요');
      return `<div>· [${e.rule_id || '?'}] ${link} (검증일 ${e.verified_at || '?'})</div>`;
    }).join('');
  } else {
    ev.innerHTML = '';
  }
};
</script>
</body>
</html>
