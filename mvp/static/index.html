<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금융행동 사전검증 — Action Reversal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root {
    color-scheme: light;
    --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fa;
    --ink:#10131a; --ink-2:#545e6e; --ink-3:#8992a1;
    --line:#e1e5ec; --line-strong:#c7ccd6;
    --accent:#1a56e8; --accent-ink:#0e3bb0; --accent-sf:#ebf0fe;
    --good:#14824b; --good-sf:#e4f4ea;
    --warn:#a15b12; --warn-sf:#f7ecdc;
    --crit:#b0272f; --crit-sf:#fbe9ea;
    --mono: "JetBrains Mono", ui-monospace, Consolas, "D2Coding", monospace;
    --shadow-sm: 0 1px 2px rgba(16,19,26,0.05);
    --shadow-md: 0 8px 24px -12px rgba(16,19,26,0.16), 0 2px 6px rgba(16,19,26,0.05);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Gothic A1","Pretendard",-apple-system,"Malgun Gothic",sans-serif;
    line-height:1.6; padding:28px 20px 80px; }
  .wrap { max-width:760px; margin:0 auto; }

  .appbar { display:flex; align-items:center; gap:10px; padding:2px 0 20px; }
  .logo { width:30px; height:30px; border-radius:8px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; flex:none; }
  .logo svg { width:16px; height:16px; }
  .appname { font-size:16px; font-weight:800; letter-spacing:-0.01em; }
  .appbar .spacer { flex:1; }

  h1 { font-size:21px; font-weight:800; margin:0 0 4px; letter-spacing:-0.01em; text-wrap:balance; }
  .lede { font-size:13px; color:var(--ink-3); margin:0 0 16px; }
  .snapshot { font-size:11.5px; font-family:var(--mono); color:var(--ink-2); background:var(--surface);
    border:1px solid var(--line); border-radius:999px; padding:6px 13px; display:inline-flex;
    align-items:center; gap:6px; margin-bottom:22px; }
  .snapshot::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--good); flex:none; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow-sm); padding:20px 22px 22px; margin-bottom:14px; }
  label { font-size:12.5px; font-weight:600; color:var(--ink-2); display:block; margin-bottom:7px; }
  textarea, input, select { width:100%; padding:10px 13px; border:1.5px solid var(--line-strong);
    border-radius:10px; font-size:13.5px; font-family:inherit; color:var(--ink);
    background:var(--surface-2); margin-bottom:13px; }
  textarea:focus, input:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px;
    border-color:var(--accent); background:var(--surface); }
  select, input:not([type=checkbox]) { background:var(--surface); }

  button { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 18px;
    font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer; }
  button:hover { background:var(--accent-ink); }
  button:focus-visible { outline:2px solid var(--accent-ink); outline-offset:2px; }
  button.secondary { background:var(--surface); color:var(--ink); border:1.5px solid var(--line-strong); }

  .badge { display:inline-block; padding:5px 14px; border-radius:100px; font-weight:700; font-size:13.5px;
    font-family:var(--mono); }
  .badge.PASS, .badge.SAFE { background:var(--good-sf); color:var(--good); }
  .badge.REVIEW, .badge.WARNING { background:var(--warn-sf); color:var(--warn); }
  .badge.HOLD, .badge.EXECUTION_BLOCKED, .badge.BREACH { background:var(--crit-sf); color:var(--crit); }
  .badge.NOT_APPLICABLE, .badge.EQUAL { background:var(--surface-2); color:var(--ink-3); }
  .badge.ADVANTAGEOUS { background:var(--good-sf); color:var(--good); }
  .badge.DISADVANTAGEOUS { background:var(--crit-sf); color:var(--crit); }

  .subhead { font-size:11px; font-weight:700; color:var(--ink-3); text-transform:uppercase;
    letter-spacing:.05em; margin:20px 0 9px; }
  .subhead:first-child { margin-top:0; }
  .note { font-size:11.5px; color:var(--ink-3); margin-top:7px; line-height:1.55; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:2px; }
  .stat { background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
  .stat .l { font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; }
  .stat .v { font-family:var(--mono); font-size:15px; font-weight:700; margin-top:4px;
    font-variant-numeric:tabular-nums; }
  .reason { margin-top:12px; font-size:13.5px; color:var(--ink); line-height:1.6; }
  .evidence { margin-top:10px; font-size:11.5px; color:var(--ink-2); font-family:var(--mono);
    word-break:break-all; line-height:1.7; }
  .evidence a { color:var(--accent-ink); }
  .interpret-box { font-size:12.5px; padding:11px 13px; border-radius:10px; margin-top:11px; line-height:1.6; }
  .interpret-box.OK { background:var(--good-sf); color:var(--ink); }
  .interpret-box.NEED_INFO, .interpret-box.UNSUPPORTED { background:var(--warn-sf); color:var(--ink); }
  .interpret-box.ERROR { background:var(--crit-sf); color:var(--ink); }

  #resultCard { box-shadow:var(--shadow-md); }
  #resultCard #decisionBadge { margin-bottom:2px; }

  /* 2026-09-06 (심사위원용 결과화면 UX 개선): '한눈에 보는 결과' 요약 카드.
     engine/판정 로직은 그대로이고, 이미 계산된 값(decision/reason/effects/safety/
     condition)을 사람이 3~5초 안에 읽을 수 있는 문장으로 재배치만 한다. */
  .summary-card { border-radius:14px; padding:16px 18px; margin-bottom:16px; border:1.5px solid var(--line); }
  .summary-card.HOLD, .summary-card.EXECUTION_BLOCKED { background:var(--crit-sf); border-color:var(--crit); }
  .summary-card.PASS { background:var(--good-sf); border-color:var(--good); }
  .summary-card.REVIEW { background:var(--warn-sf); border-color:var(--warn); }
  /* 2026-09-06(심사위원 화면 최종 점검): 예전엔 작은 회색 텍스트라 카드 배경(연한 파스텔)
     위에서 눈에 잘 안 띄었다 — 어두운 배경의 알약(pill) 칩으로 바꿔서 HOLD/PASS/REVIEW
     어느 카드 색에서도 항상 뚜렷하게 보이게 했다. 문구/의미는 그대로다. */
  .summary-eyebrow { display:inline-block; font-size:11px; font-weight:800; letter-spacing:.02em;
    color:#fff; background:var(--ink); border-radius:999px; padding:3.5px 11px; margin:0 0 10px; }
  .summary-head { display:flex; align-items:center; gap:9px; font-size:16px; font-weight:800;
    letter-spacing:-0.01em; margin-bottom:7px; text-wrap:balance; }
  .summary-icon { font-size:20px; line-height:1; flex:none; }
  .summary-body { font-size:13.5px; color:var(--ink); line-height:1.6; margin:0 0 4px; }
  .summary-card .stat-grid { margin-top:11px; }
  .summary-card .stat { background:rgba(255,255,255,0.6); }

  /* 상세 보기(규칙 코드/전체 계산 항목) 접기 — 기본 화면은 위 요약 카드만으로
     충분히 읽히게 하고, rule_id 같은 내부값은 여기 펼쳐야만 보이게 한다. */
  #detailToggle { margin-top:16px; border-top:1px solid var(--line); padding-top:4px; }
  #detailToggle > summary { cursor:pointer; font-size:12.5px; font-weight:700; color:var(--accent-ink);
    padding:9px 2px; list-style:none; user-select:none; }
  #detailToggle > summary::-webkit-details-marker { display:none; }
  #detailToggle > summary::before { content:'▸ 상세 보기 (규칙 코드 · 전체 계산 항목)'; }
  #detailToggle[open] > summary::before { content:'▾ 상세 보기 접기'; }

  /* 2026-09-04: 다크모드 자동 전환을 껐다 — 시스템 설정과 무관하게 항상 흰 배경으로
     고정한다(요청: "다시 흰배경으로 바꾸자"). 위 :root 라이트 팔레트가 유일한 팔레트다. */
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L4 8V16L12 21L20 16V8L12 3Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 3V21M4 8L12 12L20 8" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="appname">Butterfin</span>
    <span class="spacer"></span>
  </div>

  <h1>금융행동 사전검증</h1>
  <p class="lede">계획 중인 행동이 지금 받고 있는 우대조건을 깨는지, 실행 전에 확인하세요.</p>
  <div class="snapshot" id="snapshot">검증 스냅샷 기준일 확인 중…</div>

  <div class="card">
    <label>1. 하려는 행동을 문장으로 입력하세요</label>
    <textarea id="actionText" rows="2" maxlength="300" placeholder="예: 다음 달부터 카드사용 5만원을 다른 카드로 옮길 거야"></textarea>
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:2px;">
      <button id="interpretBtn">해석하기</button>
      <button id="exampleBtn" type="button" class="secondary">예시 시나리오 실행</button>
      <span class="note" id="exampleCounter" style="margin:0;"></span>
    </div>
    <div id="interpretResult"></div>
  </div>

  <div class="card">
    <label>2. 자동으로 채워진 값 확인 후 검증 실행</label>
    <select id="actionType">
      <option value="CARD_SPEND_SHIFT" title="CARD_SPEND_SHIFT">카드 사용금액 이동</option>
      <option value="PRODUCT_TERMINATION" title="PRODUCT_TERMINATION">상품 해지</option>
      <option value="PAYMENT_ACCOUNT_CHANGE" title="PAYMENT_ACCOUNT_CHANGE">결제계좌 변경</option>
      <option value="SALARY_ACCOUNT_CHANGE" title="SALARY_ACCOUNT_CHANGE">급여계좌 변경</option>
    </select>
    <label>은행/기관 <span class="note" style="display:inline;font-weight:400;">— 영향을 받을 수 있는 금융기관을 선택하세요.</span></label>
    <select id="institution">
      <option value="">전체 (자동)</option>
    </select>
    <label>상품명 <span class="note" style="display:inline;font-weight:400;">— 영향을 받을 수 있는 상품을 선택하세요.</span></label>
    <select id="product">
      <option value="">전체 (자동)</option>
    </select>
    <div id="continuousOnlyFields">
      <label>월 이동 금액</label>
      <input id="amount" type="number" value="30000">
      <label>이 행동으로 예상되는 월 혜택 (선택) <span class="note" style="display:inline;font-weight:400;">— 예: 다른 카드로 옮겼을 때 추가로 받는 캐시백</span></label>
      <input id="directBenefit" type="number" value="0">
    </div>
    <label><input id="exceptionMet" type="checkbox" style="width:auto;display:inline;margin-right:6px;">예외 조건(예: 청약 당첨 해지)이 적용됨</label>
    <label>해지/변경 후 새로 가입하려는 상품의 금리 (%, 선택 — 상품 해지·계좌변경일 때만. 원금이 같다고 가정한 단순 비교용)</label>
    <input id="newProductRate" type="number" step="0.01" placeholder="예: 3.5 (입력 안 하면 비교 생략)">
    <button id="evaluateBtn">검증 실행</button>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div id="summaryCard"></div>
    <div id="decisionBadge"></div>
    <div class="reason" id="reasonText"></div>
    <details id="detailToggle">
      <summary></summary>
      <div id="statGrid"></div>
      <div class="evidence" id="evidenceText"></div>
    </details>
  </div>
</div>

<script>
async function loadSnapshot() {
  const r = await fetch('/api/health').then(r => r.json()).catch(() => null);
  const el = document.getElementById('snapshot');
  if (r) {
    el.textContent = `검증 스냅샷 기준일: ${r.verified_at || '?'} · 규칙 ${r.rules_loaded}개 로딩 · 상태: ${r.status === 'ok' ? '정상' : '점검 필요'}`;
    // 은행/상품 드롭다운을 서버가 실제로 로딩한 institution/product 목록으로 채운다 —
    // demo_rules.json에 있는 이름만 옵션으로 나오게 해서(하드코딩 안 함) 프론트와
    // 데이터가 어긋나지 않게 한다. 둘은 독립적인 축이라 각자 따로 채운다.
    const fillOptions = (selectId, values) => {
      if (!Array.isArray(values)) return;
      const sel = document.getElementById(selectId);
      for (const v of values) {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
      }
    };
    fillOptions('institution', r.institutions);
    fillOptions('product', r.products);
  } else {
    el.textContent = '서버 상태를 확인할 수 없습니다.';
  }
}
loadSnapshot();

// 미리 만들어둔 데모 시나리오 5개 — demo_rules.json에 실제로 등록된 기관/상품과
// 정확히 일치하는 institution/product/actionType/amount/directBenefit을 여기
// preset으로 직접 박아둔다. "예시 시나리오 실행"을 누르면 이 preset 값을 그대로
// 2번 폼에 채운다 — AI 해석(문장→필드) 결과를 기다리거나 그 결과에 기대지 않는다.
// 2026-09-06(동학 피드백): 예전 방식은 문장만 채우고 실제 폼 값은 매번 "해석하기"
// API 응답(AI)이 institution/product 문자열을 정확히 맞혀야만 채워졌는데, 그
// 비동기 응답이 늦게 도착하거나(레이스) 문자열이 옵션과 정확히 안 맞으면 이전
// 예시의 값이 화면에 그대로 남는 문제가 있었다(예: KB 예시인데 상품이 신협
// 상품으로 남아 REVIEW가 나옴). preset을 직접 지정해 항상 결정적으로 채우도록
// 바꿨다 — 엔진/규칙 값은 전혀 안 바뀌었고 프론트가 무엇을 채우는지만 바뀌었다.
const EXAMPLE_SCENARIOS = [
  { text: 'KB국민은행 신용대출에서 카드 이용실적 우대를 받고 있어. 다음 달부터 매달 5만원 정도를 다른 카드로 옮기려고 하고, 옮기면 월 1,000원 정도 혜택을 더 받을 수 있어.',
    actionType: 'CARD_SPEND_SHIFT', institution: 'KB국민은행', product: '대출 금리감면 (일반 신용대출)', amount: 50000, directBenefit: 1000 },
  { text: 'KB국민은행 신용대출에서 카드 이용실적 우대를 받고 있어. 다음 달부터 매달 2만원 정도만 다른 카드로 옮기려고 해.',
    actionType: 'CARD_SPEND_SHIFT', institution: 'KB국민은행', product: '대출 금리감면 (일반 신용대출)', amount: 20000, directBenefit: 0 },
  { text: '내집마련 디딤돌대출 우대금리를 받고 있는데, 지금 유지 중인 청약종합저축을 해지하려고 해.',
    actionType: 'PRODUCT_TERMINATION', institution: '주택금융공사', product: '내집마련 디딤돌대출', amount: null, directBenefit: null },
  { text: '케이뱅크 주거래우대 자유적금의 우대금리를 받고 있어. 지금 케이뱅크 계좌에서 자동이체되는 통신비를 다른 은행 계좌로 바꾸려고 해.',
    actionType: 'PAYMENT_ACCOUNT_CHANGE', institution: '케이뱅크', product: '주거래우대 자유적금', amount: null, directBenefit: null },
  { text: '신협 플러스정기적금의 급여이체 우대를 받고 있어. 앞으로 급여를 신협이 아닌 다른 은행 계좌로 받으려고 해.',
    actionType: 'SALARY_ACCOUNT_CHANGE', institution: '신협', product: '플러스정기적금(신한카드연계형) 10차', amount: null, directBenefit: null },
];
let exampleIdx = 0;
// 2026-09-06: interpret()가 비동기로 돌아오는 동안 사용자가 예시를 넘기거나
// 해석하기를 다시 누르면, 먼저 보낸 요청의 응답이 나중에 도착해 방금 새로
// 채운 값을 덮어쓸 수 있다(레이스 컨디션). 요청을 보낼 때마다(그리고 예시로
// 폼을 결정적으로 채울 때마다) 이 카운터를 올리고, 응답이 도착했을 때 그
// 사이 카운터가 더 올라갔으면(=더 최신 요청/입력이 있었으면) 그 응답은
// 버린다 — fail-closed로 오래된 값이 화면을 덮지 않게 한다.
let requestGen = 0;
// 2026-09-05: 문장에 "대출잔액 3천만원"처럼 연계 계약 잔액이 명시돼 있으면 interpret가
// 뽑아준 값을 여기 저장해뒀다가 evaluate 요청에 그대로 실어 보낸다. 이 값이 없으면
// evaluate 요청에도 아무 것도 안 실어 보내고, 서버가 기본 가정값(1억원)을 쓰면서
// 그 사실을 assumed:true로 알려준다 — 프론트는 그 신호를 그대로 화면에 옮겨 적는다.
let interpretedLinkedBalance = null;

function updateExampleCounter() {
  document.getElementById('exampleCounter').textContent =
    `예시 ${exampleIdx + 1}/${EXAMPLE_SCENARIOS.length} — 다시 누르면 다음 예시`;
}
updateExampleCounter();

// 2026-09-06: actionType이 CARD_SPEND_SHIFT가 아니면(상품 해지/결제계좌 변경/
// 급여계좌 변경) '월 이동 금액'/'즉시 얻는 이득' 값은 엔진 판정에 전혀 쓰이지
// 않는다 — 입력칸을 아예 숨겨서 안 쓰는 값이 남아 있어 혼란을 주지 않게 한다.
// resetValues=true면 숨길 때 값도 같이 비운다(직전 CARD_SPEND_SHIFT 예시의
// amount=20000 같은 값이 안 보이는 채로 남아있다가 나중에 다시 나타나는 걸 방지).
function applyActionTypeVisibility(resetValues) {
  const discrete = document.getElementById('actionType').value !== 'CARD_SPEND_SHIFT';
  document.getElementById('continuousOnlyFields').style.display = discrete ? 'none' : '';
  if (discrete && resetValues) {
    document.getElementById('amount').value = '';
    document.getElementById('directBenefit').value = 0;
  }
}
document.getElementById('actionType').addEventListener('change', () => applyActionTypeVisibility(true));
applyActionTypeVisibility(false);

document.getElementById('exampleBtn').onclick = () => {
  // 진행 중인(아직 응답 안 온) 해석하기 요청이 있다면 여기서 무효화한다 — 그 응답이
  // 나중에 도착해도 아래에서 새로 채우는 preset 값을 덮어쓰지 못하게 한다.
  requestGen++;
  const preset = EXAMPLE_SCENARIOS[exampleIdx];

  // 2026-09-06(동학 피드백): institution/product/amount/directBenefit을 AI
  // 해석 결과에 기대지 않고 이 예시의 preset 값으로 직접, 결정적으로 채운다.
  // institution/product는 서버가 실제로 로딩한 옵션 목록에 있는 문자열과 정확히
  // 일치할 때만 선택하고, 일치하지 않으면(서버 규칙이 바뀐 경우 등) 값을 지어내지
  // 않고 "전체(자동)"로 비워둔다.
  const setIfOption = (selectId, value) => {
    const sel = document.getElementById(selectId);
    sel.value = (value && Array.from(sel.options).some(o => o.value === value)) ? value : '';
  };
  document.getElementById('actionType').value = preset.actionType;
  setIfOption('institution', preset.institution);
  setIfOption('product', preset.product);
  document.getElementById('amount').value = (preset.amount !== null && preset.amount !== undefined) ? preset.amount : '';
  document.getElementById('directBenefit').value = (preset.directBenefit !== null && preset.directBenefit !== undefined) ? preset.directBenefit : 0;
  document.getElementById('exceptionMet').checked = false;
  document.getElementById('newProductRate').value = '';
  document.getElementById('interpretResult').innerHTML = '';
  document.getElementById('resultCard').style.display = 'none';
  interpretedLinkedBalance = null;
  // resetValues=false: 위에서 이미 이 예시에 맞는 amount/directBenefit 값을
  // 정확히 넣었으므로, 여기서는 숨김 여부만 actionType에 맞게 다시 맞춘다.
  applyActionTypeVisibility(false);

  const el = document.getElementById('actionText');
  // 일반 .value 대입은 일부 브라우저/자동화 환경에서 input 이벤트를 놓칠 수 있어,
  // 네이티브 setter를 직접 호출하고 input 이벤트를 수동으로 발생시킨다.
  const setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
  setter.call(el, preset.text);
  el.dispatchEvent(new Event('input', {bubbles:true}));
  el.focus();
  exampleIdx = (exampleIdx + 1) % EXAMPLE_SCENARIOS.length;
  updateExampleCounter();
};

// 2026-09-05 (독립감사 F27): clarifying_question은 AI가 생성한 자유 문자열이라
// innerHTML에 그대로 꽂으면, AI 응답이 손상되거나 악의적으로 조작된 경우
// <script>/onerror= 같은 태그가 그대로 실행될 수 있다(XSS). 이 값만 escape해서
// 순수 텍스트로만 삽입한다 — 판정 로직/문구 자체는 안 바꿨다.
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

document.getElementById('interpretBtn').onclick = async () => {
  // 이 요청이 유효한 채로 남아있는 동안의 "세대 번호"를 찍어둔다 — 응답이 오기 전에
  // 예시 전환이나 재해석 요청이 또 발생하면 requestGen이 올라가고, 그러면 이 응답은
  // 이미 낡은 것이므로 화면에 반영하지 않는다(레이스 컨디션으로 방금 채운 값이
  // 오래된 응답에 덮이는 것을 막는다).
  const myGen = ++requestGen;
  const text = document.getElementById('actionText').value;
  const box = document.getElementById('interpretResult');
  box.innerHTML = '해석 중…';
  try {
    const res = await fetch('/api/interpret', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})});
    const data = await res.json();
    if (myGen !== requestGen) return; // 더 최신 요청/입력이 이미 발생함 — 이 응답은 버린다
    const d = data.delta;
    // 내부 예외 메시지(d.reason)는 화면에 노출하지 않는다 — action_type이나
    // clarifying_question처럼 사람이 읽을 수 있게 준비된 문구만 보여준다.
    // 2026-09-06(심사위원 화면 최종 점검): action_type 원본 코드(CARD_SPEND_SHIFT 등)와
    // status 원본 값(OK/NEED_INFO/...)을 기본 화면에 그대로 노출하지 않는다 —
    // actionTypeLabel()/STATUS_LABEL로 사람이 읽는 한국어로 바꿔서 보여준다. 판정에
    // 쓰이는 값(d.action_type 자체)은 바뀌지 않는다 — 화면 표시 문구만 바뀐다.
    const shown = escapeHtml(d.action_type ? actionTypeLabel(d.action_type) : (d.clarifying_question || (d.status === 'UNSUPPORTED' ? '지원하지 않는 행동 유형입니다.' : '')));
    const statusShown = escapeHtml(STATUS_LABEL[d.status] || d.status);
    const foundBits = [d.institution, d.product].filter(Boolean).join(' · ');
    const dbBit = d.direct_benefit_monthly ? ' · 예상 월 혜택 ' + d.direct_benefit_monthly.toLocaleString() + '원 인식됨' : '';
    box.innerHTML = `<div class="interpret-box ${d.status}"><b>${statusShown}</b> — ${shown}${d.amount_monthly ? ' · ' + d.amount_monthly.toLocaleString() + '원' : ''}${foundBits ? ' · [' + foundBits + '] 인식됨' : ''}${dbBit}</div>`;
    // 2026-09-04: 전체 status가 NEED_INFO(심지어 UNSUPPORTED)여도, 그 문장에서 개별
    // 필드 단위로 이미 확실하게 뽑힌 값이 있으면(예: 금액은 있는데 행동 유형만 모호한
    // 경우) 2번 항목에 그 값들은 채워준다 — 전체 status와 필드별 채움은 서로 다른
    // 질문이다. status 자체의 의미(불렀는지/막혔는지)는 위 배지에서 그대로 보여주고,
    // 여기서는 "채울 수 있는 건 채운다"는 원칙만 적용한다. status가 ERROR일 때만
    // (해석 요청 자체가 실패한 경우) 아무 것도 건드리지 않는다.
    if (d.status !== 'ERROR') {
      if (d.action_type) document.getElementById('actionType').value = d.action_type;
      // actionType이 방금 바뀌었을 수 있으니(예: 문장이 상품 해지로 해석됨) 이산형
      // 여부에 따라 월 이동 금액/즉시 이득 입력칸 표시 여부를 다시 맞춘다. 여기서는
      // 값을 강제로 비우지 않는다(resetValues=false) — 바로 아래에서 amount_monthly가
      // 있으면 그 값으로 채워지므로, 먼저 비웠다가 다시 채우는 이중 처리를 피한다.
      applyActionTypeVisibility(false);
      if (d.amount_monthly) document.getElementById('amount').value = d.amount_monthly;
      // 문장에 "직접효과/즉시 이득"이 금액과 함께 명시돼 있으면 그 값으로 카드 2의
      // 직접 이득 입력창을 채운다. 문장에 없으면(null) 손대지 않는다 — 기존 값(기본
      // 0 또는 사용자가 이미 입력해둔 값)을 그대로 둔다.
      if (d.direct_benefit_monthly !== null && d.direct_benefit_monthly !== undefined) {
        document.getElementById('directBenefit').value = d.direct_benefit_monthly;
      }
      // 문장에 등록된 은행명/상품명이 언급됐으면(예: "신협 카드로 옮길 거야", "디딤돌대출
      // 해지하려고") 두 드롭다운을 각각 독립적으로 자동 선택한다 — 은행명만으로는
      // 상품이 안 좁혀질 수 있어서 하나가 다른 하나를 대신하지 않는다. 옵션에 없는
      // 값이면(서버가 모르는 이름) 그냥 둔다.
      const autoSelect = (selectId, value) => {
        const sel = document.getElementById(selectId);
        if (value && Array.from(sel.options).some(o => o.value === value)) {
          sel.value = value;
        }
      };
      autoSelect('institution', d.institution);
      autoSelect('product', d.product);
      // 문장에 연계 계약 잔액(대출잔액 등)이 명시돼 있으면 저장해둔다 — 없으면(null)
      // interpretedLinkedBalance는 그대로 null로 두고, evaluate가 서버 기본 가정값을
      // 쓰게 한다(추측해서 채우지 않는다).
      if (d.linked_balance_won !== null && d.linked_balance_won !== undefined) {
        interpretedLinkedBalance = d.linked_balance_won;
      }
    }
  } catch (e) {
    box.innerHTML = `<div class="interpret-box ERROR">해석 요청 중 문제가 발생했습니다. 아래 2번 항목에서 직접 입력해 주세요.</div>`;
  }
};

// ---- 표시 헬퍼: 값이 없으면(null/undefined) 절대 "0원"으로 보이지 않게 한다.
// engine API가 계산을 안 한 것(unknown)과 0으로 계산된 것(known-zero)을 구분해서
// 넘겨주므로, 프론트는 그 판단을 다시 하지 않고 그대로 옮겨 적기만 한다.
function fmtWon(v) {
  return (v === null || v === undefined) ? '확인 필요' : (v >= 0 ? '+' : '') + Math.round(v).toLocaleString() + '원';
}
function fmtWonPlain(v) {
  return (v === null || v === undefined) ? '확인 필요' : Math.round(v).toLocaleString() + '원';
}
function fmtMonth(v) {
  return (v === null || v === undefined) ? '없음' : v + '개월 뒤';
}
function statCard(l, v) {
  return `<div class="stat"><div class="l">${l}</div><div class="v">${v}</div></div>`;
}
function fmtRange(min, max) {
  if (min === null && max === null) return '계산에 필요한 정보 부족';
  return `${fmtWonPlain(min)} ~ ${fmtWonPlain(max)}`;
}

// FIX-1(02_FIX_1차원SafeZone_4개.md): "불확실성 정보 없음 → nominal과 동일" 정책을
// 채택했다 — robust_safe_limit은 이미 nominal과 같은 값으로 계산돼 있으므로(엔진이
// 임의 버퍼를 만들지 않음), 화면 문구도 "계산 안 함"이라고 하지 않는다. 숫자 범위와
// "계산 안 함"을 동시에 보여주던 예전 모순 표현을 여기서 없앤다.
// 2026-09-06 (심사위원용 결과화면 UX 개선): "Robust"/"Nominal" 같은 영어 전문
// 용어를 기본 화면 문구에서 없앴다 — 계산 로직/값은 그대로이고 문구만 순화했다.
// 괄호 안에 원래 전문용어를 남겨서, 필요한 사람은 여전히 찾을 수 있게 했다.

  EMPTY_SAFE_ZONE: '안전하게 실행 가능한 범위 없음 — 최악의 경우 즉시 영향 가능',
};
// FIX-2: robust와 nominal이 같으면 Warning Zone은 공집합이다. "20,000원 ~ 20,000원"처럼

const WARNING_STATUS_LABEL = {

  NONE: '해당 없음 — 안전하게 실행 가능한 범위와 안전 한도가 같아서 별도의 위험 구간이 없습니다.',
  NOT_APPLICABLE: '계산에 필요한 정보 부족',
};
const CLIFF_STATUS_LABEL = {
  CALCULATED: '계산됨',
  NOT_APPLICABLE: '해당 없음 (실제 불연속 지점 없음)',
  UNKNOWN: '계산에 필요한 정보 부족 (연계 잔액 등 미입력)',
};

// 2026-09-06 (심사위원용 결과화면 UX 개선): 내부 코드명(action_type/rule_id)을
// 기본 화면에 그대로 노출하지 않기 위한 사람이 읽는 이름 매핑. 판정 로직/값에는
// 전혀 관여하지 않는 순수 표시용 상수다 — 여기 없는 값은 원래 코드값을 그대로
// 보여준다(값을 지어내지 않는다는 원칙 유지, 매핑 누락이 화면을 깨지 않게).
// 2026-09-06: "해석하기" 결과 배지에 쓰는 status 원본 값(OK/NEED_INFO/UNSUPPORTED/
// ERROR)도 같은 원칙으로 한국어로 바꿔서 보여준다. 여기 없는 값은 원래 값을 그대로
// 보여준다(값을 지어내지 않는다는 원칙 유지).
const STATUS_LABEL = {
  OK: '인식 완료',
  NEED_INFO: '정보 더 필요',
  UNSUPPORTED: '지원하지 않는 행동',
  ERROR: '오류',
};
const ACTION_TYPE_LABEL = {
  CARD_SPEND_SHIFT: '카드 사용금액 이동',
  PRODUCT_TERMINATION: '상품 해지',
  PAYMENT_ACCOUNT_CHANGE: '결제계좌 변경',
  SALARY_ACCOUNT_CHANGE: '급여계좌 변경',
};
function actionTypeLabel(t) { return ACTION_TYPE_LABEL[t] || t || '이 행동'; }

const RULE_LABEL = {
  KB_CARD_LOAN_STEP: 'KB 대출 우대조건',
  KB_SAVINGS_LOAN_HOLD: 'KB 대출 연계 우대조건',
  HF_SUBSCRIPTION_DIDIMDOL: '디딤돌대출 청약통장 연계 우대조건',
  KBANK_TELECOM_SAVINGS: '케이뱅크 자유적금 우대조건',
  SHINHYUP_SALARY: '신협 급여이체 우대조건',
  SHINHYUP_CARD_ACCOUNT: '신협 결제계좌 우대조건',
  SHINHYUP_CARD_USAGE: '신협 카드실적 우대조건',
  HANA_HISTORY_SAVINGS: '하나은행 적금 가입이력 조건',
};
function ruleLabel(id) { return RULE_LABEL[id] || id; }
// 요약 카드용 — rule_id 자체는 노출하지 않고 사람이 읽는 이름만 이어 붙인다.
function ruleLabelsText(ids) {
  if (!Array.isArray(ids) || !ids.length) return '관련';
  return ids.map(ruleLabel).join(', ');
}
// 상세 보기용 — 사람이 읽는 이름과 원래 코드값(rule_id)을 같이 보여준다.
function ruleLabelWithCode(id) {
  const label = RULE_LABEL[id];
  return label ? `${label} (${id})` : id;
}

// 2026-09-06: '한눈에 보는 결과' 요약 카드. 여기서 새로 계산하는 값은 하나도
// 없다 — /api/evaluate가 이미 계산해 돌려준 decision/reason/effects/safety/
// condition 값을 사람이 3~5초 안에 읽을 수 있는 문장으로 재배치할 뿐이다.
function buildSummaryCard(data, isDiscreteType, safety, effects, condition, time) {
  const decision = data.decision || 'REVIEW';
  const actionRaw = data.action && data.action.type;
  const aLabel = actionTypeLabel(actionRaw);
  const rLabel = ruleLabelsText(data.matched_rules);

  let icon = '🔍', headline = '지금 정보로는 안전 여부를 확정할 수 없습니다.';
  const bodyLines = [];
  let statsHtml = '';

  if (!isDiscreteType) {
    // CARD_SPEND_SHIFT — 연속 금액 모델. 계획 금액과 안전 한도를 직접 비교해 보여준다.
    const amount = data.action && data.action.amount !== null && data.action.amount !== undefined ? data.action.amount : null;
    const limit = safety.nominal_safe_limit !== null && safety.nominal_safe_limit !== undefined ? safety.nominal_safe_limit : null;
    if (decision === 'HOLD') {
      icon = '⚠️'; headline = '이 계획은 그대로 실행하지 않는 것이 좋습니다.';
      bodyLines.push(`월 ${fmtWonPlain(amount)}을 다른 카드로 옮기면 보유 중인 ${rLabel}에 영향을 줍니다.`);
      const stats = [];
      if (limit !== null) stats.push(statCard('안전한 이동금액', `월 ${fmtWonPlain(limit)} 이하`));
      if (amount !== null && limit !== null) {
        stats.push(statCard('현재 계획', `${fmtWonPlain(amount)} → 안전한도보다 ${fmtWonPlain(amount - limit)} 초과`));
      }
      if (effects.G && effects.G.value !== null && effects.G.value !== undefined) {
        const ttr = time.TTR;
        stats.push(statCard('예상 전체효과', `${(ttr !== null && ttr !== undefined) ? ttr + '개월 뒤 ' : ''}${fmtWon(effects.G.value)}`));
      }
      if (stats.length) statsHtml = `<div class="stat-grid">${stats.join('')}</div>`;
    } else if (decision === 'PASS') {
      icon = '✅'; headline = '이 계획은 그대로 실행해도 안전합니다.';
      bodyLines.push(`월 ${fmtWonPlain(amount)}은 현재 유지 중인 ${rLabel}의 안전 한도 이내입니다.`);
      const stats = [];
      if (limit !== null) stats.push(statCard('안전 한도', `월 ${fmtWonPlain(limit)} 이하`));
      if (amount !== null && limit !== null) stats.push(statCard('한도까지 여유', fmtWonPlain(limit - amount)));
      if (stats.length) statsHtml = `<div class="stat-grid">${stats.join('')}</div>`;
    } else {
      icon = '🔍'; headline = '지금 정보로는 안전 여부를 확정할 수 없습니다.';
      bodyLines.push(data.reason || '추가 확인이 필요합니다.');
    }
  } else {
    // 이산형(해지/계좌변경) — %p 우대폭 상실 여부로 서술한다.
    if (decision === 'HOLD') {
      icon = '⚠️'; headline = '이 계획은 그대로 실행하지 않는 것이 좋습니다.';
      const lost = condition.lost_pct_p;
      bodyLines.push(`${aLabel}을(를) 실행하면 ${rLabel}이 사라집니다${(lost !== null && lost !== undefined) ? ` (${lost}%p 상실)` : ''}.`);
    } else if (decision === 'PASS') {
      icon = '✅'; headline = '이 계획은 그대로 실행해도 우대조건에 영향이 없습니다.';
      bodyLines.push(condition.causal_note ? condition.causal_note
        : (condition.exception_applied ? `예외 조항이 적용되어 ${rLabel}이 유지됩니다.`
          : `${aLabel}을(를) 실행해도 ${rLabel}은 유지됩니다.`));
    } else {
      icon = '🔍'; headline = '지금 정보로는 안전 여부를 확정할 수 없습니다.';
      bodyLines.push(data.reason || '추가 확인이 필요합니다.');
    }
  }

  return `<div class="summary-card ${decision}">
    <div class="summary-eyebrow">한눈에 보는 결과</div>
    <div class="summary-head"><span class="summary-icon">${icon}</span><span>${headline}</span></div>
    ${bodyLines.map(l => `<div class="summary-body">${l}</div>`).join('')}
    ${statsHtml}
  </div>`;
}

// 규칙 자체가 특정 안 돼(effects 자체가 없는 REVIEW) 위 buildSummaryCard가 쓸 수
// 있는 재료가 없을 때를 위한 최소 요약 — 이때도 rule_id는 사람이 읽는 이름으로
// 바꿔서 보여준다.
function buildMinimalSummaryCard(data) {
  const decision = data.decision || 'REVIEW';
  const candNames = Array.isArray(data.candidates) && data.candidates.length
    ? data.candidates.map(c => ruleLabel(c.rule_id)).join(', ')
    : (data.matched_rules && data.matched_rules.length ? ruleLabelsText(data.matched_rules) : null);
  const body = candNames
    ? `계획하신 행동이 [${candNames}] 중 어느 계약에 영향을 주는지 특정되지 않았습니다. 은행/상품을 정확히 지정하면 확정 판정을 받을 수 있습니다.`
    : (data.reason || '추가 확인이 필요합니다.');
  return `<div class="summary-card ${decision}">
    <div class="summary-eyebrow">한눈에 보는 결과</div>
    <div class="summary-head"><span class="summary-icon">🔍</span><span>지금 정보로는 안전 여부를 확정할 수 없습니다.</span></div>
    <div class="summary-body">${body}</div>
  </div>`;
}

document.getElementById('evaluateBtn').onclick = async () => {
  const action_type = document.getElementById('actionType').value;
  const institution = document.getElementById('institution').value || undefined;
  const product = document.getElementById('product').value || undefined;
  const amount_monthly = Number(document.getElementById('amount').value);
  const direct_benefit_monthly = Number(document.getElementById('directBenefit').value) || 0;
  const exception_condition_met = document.getElementById('exceptionMet').checked;
  const newProductRateRaw = document.getElementById('newProductRate').value;

  let data;
  try {
    const payload = {action_type, institution, product, amount_monthly, direct_benefit_monthly, exception_condition_met};
    // interpretedLinkedBalance가 있을 때만 실어 보낸다 — 안 실어 보내면 서버가 기본
    // 가정값(1억원)을 쓰면서 그 사실을 응답의 effects.linked_balance.assumed로 알려준다.
    if (interpretedLinkedBalance !== null) payload.linked_balance = interpretedLinkedBalance;
    // 2026-09-05(동학 요청): "해지 후 새로 가입할 상품 금리를 넣으면 이득/손해
    // 비교" — 사용자가 실제로 입력했을 때만 보낸다. 비워두면 서버는 비교 자체를
    // 생략한다(값을 지어내지 않는다).
    if (newProductRateRaw !== '') payload.new_product_rate_pct = Number(newProductRateRaw);
    const res = await fetch('/api/evaluate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)});
    if (!res.ok) throw new Error('server_error');
    data = await res.json();
  } catch (e) {
    // fail-closed: 서버/네트워크 문제로 판정을 못 받으면 자동으로 PASS인 척하지
    // 않는다 — REVIEW로 표시하고 사람 확인을 안내한다.
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('summaryCard').innerHTML = `<div class="summary-card REVIEW">
      <div class="summary-eyebrow">한눈에 보는 결과</div>
      <div class="summary-head"><span class="summary-icon">🔍</span><span>지금 정보로는 안전 여부를 확정할 수 없습니다.</span></div>
      <div class="summary-body">서버에서 판정 결과를 받지 못했습니다. 잠시 후 다시 시도하거나 담당자에게 확인해 주세요.</div>
    </div>`;
    document.getElementById('decisionBadge').innerHTML = `<span class="badge REVIEW">REVIEW</span>`;
    document.getElementById('reasonText').textContent = '서버에서 판정 결과를 받지 못했습니다. 잠시 후 다시 시도하거나 담당자에게 확인해 주세요.';
    document.getElementById('statGrid').innerHTML = '';
    document.getElementById('evidenceText').innerHTML = '';
    return;
  }

  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('decisionBadge').innerHTML = `<span class="badge ${data.decision}">${data.decision}</span>`;
  document.getElementById('reasonText').textContent = data.reason || '판정 사유를 확인할 수 없습니다.';

  // 06_MVP_표시명세.md 순서를 그대로 따른다. 프론트는 여기서 아무 것도 다시
  // 계산하지 않는다 — engine API(app.py /api/evaluate)가 이미 계산해 돌려준
  // safety/effects/time/evidence 값을 순서대로 옮겨 적을 뿐이다.
  const safety = data.safety || {};
  const effects = data.effects || {};
  const time = data.time || {};
  const condition = data.condition || {};
  const isDiscreteType = safety.current_zone === 'NOT_APPLICABLE' && (data.action ? data.action.amount === null : true);

  // 2026-09-05 (V7 FIX 1 후속): 규칙 자체가 안 매칭됐거나(REVIEW: 규칙 없음/구간정보
  // 없음/금액 없음) 여러 규칙이 동시에 매칭돼(REVIEW: 다중 후보, FIX 1) 아직 확정
  // 계산을 하지 않은 응답은 data.effects가 아예 없다 — 이 경우 D/L/G, Safe Zone 등
  // 상세 섹션을 만들 재료 자체가 없으므로 억지로 렌더링하지 않고(존재하지 않는 값을
  // 지어내지 않는다는 원칙 그대로) 사유/후보 목록만 보여준다.
  if (!data.effects) {
    document.getElementById('summaryCard').innerHTML = buildMinimalSummaryCard(data);
    let minimalHtml = '';
    if (Array.isArray(data.candidates) && data.candidates.length) {
      minimalHtml += `<div class="subhead">영향받을 수 있는 보유계약 후보</div><div class="stat-grid">`;
      data.candidates.forEach(c => {
        // 기본 화면(위 요약 카드)은 사람이 읽는 이름만 보여주고, 여기 상세 보기에서만
        // rule_id 원본 코드를 사람이 읽는 이름과 함께 보여준다.
        minimalHtml += statCard(ruleLabelWithCode(c.rule_id) || '?', [c.institution, c.product].filter(Boolean).join(' · ') || '확인 필요');
      });
      minimalHtml += `</div>`;
      minimalHtml += `<div class="note">위 은행/상품 입력란에 정확한 기관·상품명을 넣고 다시 판정해주세요.</div>`;
    }
    if (data.matched_rules && data.matched_rules.length) {
      minimalHtml += `<div class="note">매칭 규칙: ${data.matched_rules.map(ruleLabelWithCode).join(', ')}</div>`;
    }
    if (data.scope_note) {
      minimalHtml += `<div class="note" style="opacity:0.8;">${data.scope_note}</div>`;
    }
    document.getElementById('statGrid').innerHTML = minimalHtml;
    document.getElementById('evidenceText').innerHTML = '';
    document.getElementById('detailToggle').open = false;
    return;
  }

  document.getElementById('summaryCard').innerHTML = buildSummaryCard(data, isDiscreteType, safety, effects, condition, time);

  let html = '';

  // 2. 현재 계획 행동량 — 2026-09-05(동학 요청): "상품 종류에 따라 안 나오는 항목은
  // 아예 안 보이게" — 금액 기반 유형(CARD_SPEND_SHIFT)이 아니면 "계획 금액" 자체가
  // 존재하지 않는 개념이므로, "해당 없음" 문구로 자리만 차지하게 두지 않고 항목 자체를
  // 렌더링하지 않는다. (판정에 쓰는 값은 그대로, 화면 표시만 바뀐 것)
  html += `<div class="subhead">2. 현재 계획 행동량</div><div class="stat-grid">`;
  html += statCard('행동 유형', (data.action && data.action.type)
    ? `${actionTypeLabel(data.action.type)} (${data.action.type})`
    : '확인 필요');
  if (!isDiscreteType) {
    html += statCard('계획 금액', (data.action && data.action.amount !== null && data.action.amount !== undefined)
      ? data.action.amount.toLocaleString() + '원/월'
      : '확인 필요');
  }
  html += `</div>`;

  if (isDiscreteType) {
    // 2026-09-05: 세 이산 유형(상품 해지/결제계좌 변경/급여계좌 변경)이 전부 같은
    // 문구("이 행동 유형", "이 행동의 영향")를 쓰면 실제로 뭘 하는 건지 화면만 보고는
    // 구분이 안 된다는 지적 — action_type별로 실제 용어(해지/결제계좌/급여계좌)를
    // 그대로 써서 각 유형에 맞게 문구를 바꾼다. 판정에 쓰는 값(baseline_effect_pct_p/
        // lost_pct_p/exception_applied)은 그대로이고 표시 문구만 구체화한다.
    const DISCRETE_ACTION_LABEL = {
      PRODUCT_TERMINATION: { noun: '상품 해지', verb: '해지하면' },
      PAYMENT_ACCOUNT_CHANGE: { noun: '결제계좌 변경', verb: '결제계좌를 바꾸면' },
      SALARY_ACCOUNT_CHANGE: { noun: '급여계좌 변경', verb: '급여계좌를 바꾸면' },
    };
    const dLabel = DISCRETE_ACTION_LABEL[data.action && data.action.type] || { noun: '이 행동', verb: '이 행동을 하면' };

    html += `<div class="note">${dLabel.noun}은 1차원 연속 금액 모델을 쓰지 않아 Safe Zone/Financial Cliff(3~5, 8번) 개념이 적용되지 않습니다 — 대신 ${dLabel.noun}에 실제로 의미 있는 "조건 유지 현황"을 아래에 보여드립니다.</div>`;

    // 3'. 조건 유지 현황 — 2026-09-05: CARD_SPEND_SHIFT만 숫자가 나오고 나머지 3개
    // 유형(해지·계좌변경)은 PASS/HOLD 배지만 있고 "그래서 얼마나"가 안 보인다는
    // 지적에 대한 대응. engine.py가 이미 계산해서 버리던 baseline_effect_pct_p(현재
    // 유지 중인 우대폭)·lost_pct_p(위반 시 사라지는 폭)를 그대로 옮겨 적을 뿐이다 —
    // 새 계산이나 가짜 금액 환산을 만들어내지 않는다(원 단위 Safe Zone은 이 유형에
    // 애초에 없다는 원칙 그대로 유지).
    html += `<div class="subhead">3. ${dLabel.noun} — 조건 유지 현황</div><div class="stat-grid">`;
    html += statCard('이 등록 규칙상 우대폭', condition.baseline_effect_pct_p !== null && condition.baseline_effect_pct_p !== undefined
      ? condition.baseline_effect_pct_p + '%p' : '확인 필요');
    let impactText;
    if (condition.exception_applied) {
      impactText = `예외 조항 적용 — ${dLabel.noun} 이후에도 우대 유지됨 (상실 없음)`;
    } else if (condition.lost_pct_p !== null && condition.lost_pct_p !== undefined) {
      impactText = `${dLabel.verb} -${condition.lost_pct_p}%p 상실 (조건 미충족)`;
    } else {
      impactText = '이 조건에 영향 없음';
    }
    html += statCard(`${dLabel.noun} 시 영향`, impactText);
    html += `</div>`;

    // 2026-09-05 (V7 FIX 3): 디딤돌대출처럼 가입기간/납입회차 없이는 어느 구간
    // (tier)인지 특정할 수 없는 경우, 예전엔 tiers[0]을 임의로 골라 확정 %p를
    // 냈다 — 이제는 REVIEW로 남기고 그 이유와 사용자가 다음에 뭘 하면 되는지를
    // condition.review_note로 설명한다. 값을 지어내지 않고 이유를 보여준다.
    if (condition.review_note) {
      html += `<div class="note">${condition.review_note}</div>`;
    }

    // 2026-09-05(동학 요청): 원금이 같다고 가정하고, 새로 가입하려는 상품의 금리를
    // 사용자가 직접 입력하면 "우대 상실폭 vs 새 상품 금리"를 단순 비교해 보여준다.
    // engine.py/판정 로직은 그대로이고, app.py가 사용자가 준 숫자로 뺄셈만 한
    // 부가 정보다. 입력 안 하면(condition.new_product_rate_pct === null) 이 블록
    // 자체를 표시하지 않는다 — 값을 지어내지 않는다.
    // 2026-09-05 (V7 FIX 5): 두 값(등록 규칙의 %p 우대폭 vs 사용자가 입력한 새 상품
    // 금리 %)은 서로 다른 금융계약의 서로 다른 지표라서 단순 차감/비교로 "유리·불리"를
    // 매길 수 없다 — 예전엔 이걸 net_effect_pct_p/net_effect_verdict로 계산해
    // ADVANTAGEOUS/DISADVANTAGEOUS 배지까지 보여줬는데, 이는 존재하지 않는 정밀도를
    // 지어낸 것이었다(원금·잔여기간·중도해지조건 등을 전혀 모른 채 계산). 입력창은
    // 그대로 유지하되(퍼센트 입력창 유지, 절대 지시), 입력값을 그대로 에코만 하고
    // 서버가 함께 내려주는 new_product_rate_note로 "왜 자동 비교하지 않는지"를 명시한다.
    if (condition.new_product_rate_pct !== null && condition.new_product_rate_pct !== undefined) {
      html += `<div class="subhead">3-1. 새 상품과 비교 (참고용)</div><div class="stat-grid">`;
      html += statCard('새로 가입하려는 상품 금리', condition.new_product_rate_pct + '%');
      html += statCard('자동 손익 비교', '제공하지 않음 (아래 참고 참조)');
      html += `</div>`;
      html += `<div class="note">${condition.new_product_rate_note || '두 값은 서로 다른 금융계약의 지표이므로 단순 차감하지 않습니다.'} 위반 여부는 위 "${dLabel.noun} 시 영향"과 아래 "현재 행동 위치"를 기준으로 확인하세요.</div>`;
    }
  }

  if (!isDiscreteType) {
    // 3. 안전하게 실행 가능한 범위 (전문용어: Robust Safe Zone) — 기본 화면 문구에서는
    // 영어 전문용어를 빼고, 상세 노트에만 원래 용어를 괄호로 남긴다. 계산값 자체는
    // safety.robust_safe_zone을 그대로 옮겨 적을 뿐, 새로 계산하지 않는다.
    html += `<div class="subhead">3. 안전하게 실행 가능한 범위</div><div class="stat-grid">`;
    html += statCard('범위', fmtRange(safety.robust_safe_zone ? safety.robust_safe_zone.min : null, safety.robust_safe_zone ? safety.robust_safe_zone.max : null));
    html += statCard('상태', ROBUST_STATUS_LABEL[safety.robust_status] || safety.robust_status || '확인 필요');
    html += `</div>`;
    html += `<div class="note">(전문용어: Robust Safe Zone)</div>`;
    if (safety.robust_status === 'NOT_APPLICABLE') {
      html += `<div class="note">위 범위는 별도로 새로 계산된 값이 아니라, 아래 "5. 안전 한도"와 동일한 값을 그대로 보여준 것입니다.</div>`;
    }

    // 4. 위험 구간 (전문용어: Warning Zone) — FIX-2: robust==nominal(공집합)이면
    // 숫자 구간 대신 "해당 없음"을 보여준다. 이번 수정(경계가 한 점인 경우 방어):
    // 상태가 CALCULATED라도 min_exclusive === max_inclusive(경계값이 하나뿐인
    // 구간)이면 "20,000원 ~ 20,000원"처럼 구간처럼 안 보이고 오류처럼 보이는 표현
    // 대신 "경계값" 문구로 바꾼다 — 값 자체는 그대로, 표현만 바꾼 것이다.
    html += `<div class="subhead">4. 위험 구간</div><div class="stat-grid">`;
    const wz = safety.warning_zone || {};
    const warningLabel = WARNING_STATUS_LABEL[safety.warning_status];
    let warningDisplay;
    if (warningLabel) {
      warningDisplay = warningLabel;
    } else if (wz.min_exclusive !== null && wz.min_exclusive !== undefined
      && wz.max_inclusive !== null && wz.max_inclusive !== undefined
      && wz.min_exclusive === wz.max_inclusive) {
      warningDisplay = `경계값: 월 ${fmtWonPlain(wz.max_inclusive)} — 이 금액을 초과하면 위험합니다.`;
    } else {
      warningDisplay = fmtRange(wz.min_exclusive, wz.max_inclusive);
    }
    html += statCard('범위 (초과 ~ 이하)', warningDisplay);
    html += `</div>`;
    html += `<div class="note">(전문용어: Warning Zone)</div>`;

    // 5. 안전 한도 (전문용어: Nominal Safe Limit)
    html += `<div class="subhead">5. 안전 한도</div><div class="stat-grid">`;
    html += statCard('한도', safety.nominal_safe_limit !== null && safety.nominal_safe_limit !== undefined ? fmtWonPlain(safety.nominal_safe_limit) + '/월' : '확인 필요');
    html += `</div>`;
    html += `<div class="note">(전문용어: Nominal Safe Limit)</div>`;
  }

  // 6. 현재 행동 위치 — 2026-09-05: 이산 판정 3유형은 safety.current_zone이 app.py에서
  // 항상 문자열 "NOT_APPLICABLE"로 고정돼 있어서(연속 금액 모델의 SAFE/WARNING/BREACH
  // 개념 자체가 없으므로), 조건을 위반했든 예외로 유지됐든 이 배지가 항상 똑같이
  // "NOT_APPLICABLE"로만 보였다 — 정보가 없는 게 아니라 이미 3번 섹션에서 계산해둔
  // condition(violation/exception_applied)을 여기 배지에도 반영하지 않았을 뿐이다.
  // 그래서 이산 판정일 때는 이 값으로 실제 상태를 보여준다(연속형은 기존 그대로).
  html += `<div class="subhead">6. 현재 행동 위치</div><div class="stat-grid">`;
  if (isDiscreteType) {
    let zoneBadge, zoneLabel;
    if (condition.exception_applied) { zoneBadge = 'SAFE'; zoneLabel = '유지됨 (예외 적용)'; }
    else if (condition.lost_pct_p !== null && condition.lost_pct_p !== undefined) { zoneBadge = 'BREACH'; zoneLabel = '조건 미충족 (우대 상실)'; }
    else { zoneBadge = 'NOT_APPLICABLE'; zoneLabel = '확인 필요'; }
    html += statCard('구간', `<span class="badge ${zoneBadge}">${zoneLabel}</span>`);
  } else {
    html += statCard('구간', `<span class="badge ${safety.current_zone}">${safety.current_zone || '확인 필요'}</span>`);
  }
  html += `</div>`;

  // 7. Binding Constraint
  html += `<div class="subhead">7. Binding Constraint</div><div class="stat-grid">`;
  html += statCard('가장 엄격한 계약(동률 포함)', (safety.binding_constraints && safety.binding_constraints.length)
    ? safety.binding_constraints.map(ruleLabelWithCode).join(', ') : '확인 필요');
  html += `</div>`;

  // 8. Financial Cliff — FIX-3: 항상 horizon_months(12개월) 누적 기준. 아래 9번(D/L/G)의
  // 기준 시점(TTR/TTB, 12개월보다 이를 수 있음)과 다를 수 있다는 걸 단위와 함께 명시한다.
  // 이산 판정 유형(해지/계좌변경)은 애초에 불연속 지점 개념이 없어 이 섹션 자체를 생략한다.
  const cliff = safety.financial_cliff;  // {value, unit, horizon_months} | null
  if (!isDiscreteType) {
    html += `<div class="subhead">8. Financial Cliff</div><div class="stat-grid">`;
    html += statCard('불연속 크기 (경계 넘을 때 손익 점프)', cliff ? `${fmtWon(cliff.value)} (${cliff.horizon_months}개월 누적 기준)` : (CLIFF_STATUS_LABEL[safety.cliff_status] || '확인 필요'));
    html += statCard('상태', CLIFF_STATUS_LABEL[safety.cliff_status] || safety.cliff_status || '확인 필요');
    html += `</div>`;
  }

  // 9. D / L / G — FIX-3: 각 값이 몇 개월 시점 누적인지(horizon_months) 함께 보여준다.
  // 이 시점은 8번 Financial Cliff의 12개월과 다를 수 있다(TTR/TTB가 12개월보다 이르면
  // 그 시점 기준) — 계산 오류가 아니라 서로 다른 걸 보여주는 두 값이라는 뜻이다.
  // 2026-09-05(동학 요청): 이산 판정 유형은 금액 모델 자체가 없어 D/L/G가 항상 None이다
  // — "이 유형은 금액 모델 미지원"이라는 빈 placeholder 카드를 보여주는 대신, 이 유형에서는
  // 위 3번 "조건 유지 현황"이 이미 그 자리를 대신하므로 섹션 자체를 렌더링하지 않는다.
  if (!isDiscreteType) {
    html += `<div class="subhead">9. 경제적 효과 (D / L / G)</div><div class="stat-grid">`;
    const h = effects.D.horizon_months;
    html += statCard(`직접효과 D (${h}개월 누적)`, fmtWon(effects.D.value));
    html += statCard(`연쇄효과 L (${h}개월 누적)`, fmtWon(effects.L.value));
    html += statCard(`전체효과 G = D + L (${h}개월 누적)`, fmtWon(effects.G.value));
    html += `</div>`;
  }
  if (effects.D !== null && effects.D !== undefined && cliff && effects.D.horizon_months !== cliff.horizon_months) {
    html += `<div class="note">위 D/L/G는 ${effects.D.horizon_months}개월 시점 기준, 8번 Financial Cliff는 ${cliff.horizon_months}개월 시점 기준입니다 — 기준 시점이 달라 숫자가 차이 날 수 있습니다(계산 오류 아님).</div>`;
  }
  // 2026-09-05: 연쇄효과(L)·전체효과(G)·Financial Cliff는 전부 "연계 계약 잔액"에
  // 비례해서 계산된다. 문장에 실제 잔액이 없어 서버가 기본 가정값(1억원)을 썼다면,
  // 그 숫자가 사용자의 실제 상황을 반영한 값이 아니라는 걸 반드시 밝힌다 — 밝히지
  // 않으면 실제 값처럼 보여서 오해를 준다.
  const lb = effects.linked_balance;
  if (lb && lb.assumed) {
    html += `<div class="note">위 연쇄효과(L)·전체효과(G)·Financial Cliff는 실제 연계 계약(대출 등) 잔액을 입력받지 못해 <b>가정값 ${lb.value.toLocaleString()}원</b>을 기준으로 계산됐습니다 — 실제 잔액이 다르면 이 숫자들도 그만큼 달라집니다. 문장에 "대출잔액 OOO원"처럼 실제 잔액을 포함하면 그 값으로 계산합니다.</div>`;
  } else if (lb && !lb.assumed) {
    html += `<div class="note">위 연쇄효과(L)·전체효과(G)·Financial Cliff는 문장에서 인식한 실제 연계 계약 잔액 ${lb.value.toLocaleString()}원 기준으로 계산됐습니다.</div>`;
  }

  // 2026-09-05 (V7 FIX 6): D/L/G 계산에 쓰인 최근 3개월 카드실적(hist3)·향후 월
  // 사용액(baseline_monthly) 가정도 linked_balance와 같은 원칙으로 밝힌다 — 사용자가
  // 입력하지 않아 대표 시나리오 기본값을 썼다면 실제 값처럼 보이지 않도록 명시한다.
  const hist3Info = effects.hist3;
  const baselineInfo = effects.baseline_monthly;
  if (hist3Info && baselineInfo && (hist3Info.assumed || baselineInfo.assumed)) {
    html += `<div class="note">${effects.scenario_note || '대표 시나리오 가정을 사용했습니다.'} (최근 3개월 카드실적: ${hist3Info.value.map(v => v.toLocaleString()).join('원, ')}원, 향후 월 사용액: ${baselineInfo.value.toLocaleString()}원 — 문장에 실제 실적을 포함하면 그 값으로 계산합니다.)</div>`;
  }

  // 10. Action Reversal — FIX-4: 상단 판정 사유(위 reasonText, TTR 기준 "누적 전체효과
  // 음수 전환" 문구)와 이 섹션의 "Action Reversal 정의(D>0, G<0) 충족 여부"는 서로 다른
  // 질문이다. 둘을 같은 자리에 섞어 보여주면 모순처럼 읽힐 수 있어 완전히 분리한다.
  //
  // 2026-09-05(동학 요청): Action Reversal은 D(직접효과)>0, G(전체효과)<0을 실제로
  // "계산"해서 판정하는 개념이다 — CARD_SPEND_SHIFT(연속 금액 모델)만 D/G를 계산한다.
  // 이산 판정 유형(해지/계좌변경)은 애초에 D/G 자체가 없으므로(effects.D/G는 항상
  // null), "Action Reversal 예/아니오"를 보여주는 건 계산하지 않은 걸 계산한 것처럼
  // 보이게 할 위험이 있다. 이산형에서는 이 섹션을 Action Reversal 대신 "조건 유지/
  // 위반" 여부만 보여준다 — 이미 계산된 discrete.violation을 그대로 옮겨 적을 뿐,
  // 새 계산은 하지 않는다.
  if (!isDiscreteType) {
    html += `<div class="subhead">10. Action Reversal (정의: 직접효과 D&gt;0 이고 전체효과 G&lt;0)</div><div class="stat-grid">`;
    html += statCard('발생 여부', effects.reversal ? '예 — 당장은 이득이나 전체 손익은 손실' : '아니오');
    html += `</div>`;
  } else {
    html += `<div class="subhead">10. 조건 유지 / 위반</div><div class="stat-grid">`;
    html += statCard('상태', effects.reversal ? '위반 — 우대조건이 상실됨' : '유지 — 우대조건이 상실되지 않음');
    html += `</div>`;
    html += `<div class="note">이 유형은 D(직접효과)/G(전체효과)를 계산하지 않으므로 Action Reversal(D&gt;0, G&lt;0) 정의는 적용되지 않습니다 — 대신 조건 유지/위반 여부만 보여줍니다.</div>`;
  }
  if (effects.reversal_reason) {
    html += `<div class="reason" style="margin-top:8px;">${effects.reversal_reason}</div>`;
  }

  // 11. TTB / TTR — 2026-09-05(동학 요청): TTB/TTR은 "시간에 따라 값이 변하는 1차원
  // 연속 모델"에서만 의미가 있는 개념(예: 카드실적이 매달 누적돼 어느 달에 tier가
  // 바뀌는지)이다. 이산 판정(해지/계좌변경)은 행동 시점에 즉시 결정되는 1회성 판정이라
  // "몇 개월 뒤 조건이 깨지는지"라는 질문 자체가 성립하지 않는다(그래서 항상 None이었다)
  // — "없음"으로 채워진 빈 카드 대신 이 유형에서는 섹션 자체를 렌더링하지 않는다.
  if (!isDiscreteType) {
    html += `<div class="subhead">11. Time-to-Breach / Time-to-Reversal</div><div class="stat-grid">`;
    html += statCard('TTB (우대 조건이 깨지는 시점)', fmtMonth(time.TTB));
    html += statCard('TTR (누적 전체효과가 손해로 전환되는 시점)', fmtMonth(time.TTR));
    html += `</div>`;
  }

  if (data.matched_rules) {
    html += `<div class="note">매칭 규칙: ${data.matched_rules.length ? data.matched_rules.map(ruleLabelWithCode).join(', ') : '없음'}</div>`;
  }
  // 2026-09-05 (V7 FIX 7): 모든 판정에 공통으로 붙는 범위 고지 — "이 판정이 무엇을
  // 기준으로 내려졌는지"를 매 결과 화면 맨 아래에 한 번 명시한다.
  if (data.scope_note) {
    html += `<div class="note" style="opacity:0.8;">${data.scope_note}</div>`;
  }

  document.getElementById('statGrid').innerHTML = html;

  // 12. 공식 Evidence — 여러 계약이 매칭될 수 있으므로 배열로 온다.
  const ev = document.getElementById('evidenceText');
  const evList = Array.isArray(data.evidence) ? data.evidence : (data.evidence ? [data.evidence] : []);
  if (evList.length) {
    ev.innerHTML = '<div class="subhead" style="margin-top:0;">12. 공식 Evidence</div>' + evList.map(e => {
      const url = e.source_url;
      const safeUrl = url && /^https?:\/\//i.test(url) ? url : null;
      const link = safeUrl
        ? `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeUrl}</a>`
        : (url || '확인 필요');
      return `<div>· [${ruleLabelWithCode(e.rule_id) || '?'}] ${link} (검증일 ${e.verified_at || '?'})</div>`;
    }).join('');
  } else {
    ev.innerHTML = '';
  }
};
</script>
</body>
</html>
